[project]
name = "markov-r2-article"
version = "0.1.0"
description = "Tu descripción"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chronos-forecasting>=2.3.2",
    "pypdf>=6.19.0",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "xgboost>=3.2.0",
]

[tool.uv]
managed = true
package = false 

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
